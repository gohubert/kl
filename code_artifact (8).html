<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端時光相簿</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 9999px;
    }
    .disc-spin {
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

  <!-- 背景裝飾光暈 -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-sky-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- 頂部導航 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <i class="fa-solid fa-camera-retro text-white text-lg"></i>
        </div>
        <div>
          <h1 id="navAlbumTitle" class="text-lg sm:text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400 truncate max-w-[200px] sm:max-w-md">
            載入相簿中...
          </h1>
          <p id="navAlbumSubtitle" class="text-xs text-slate-400 hidden sm:block">珍惜每刻美好回憶</p>
        </div>
      </div>

      <!-- 右側工具區：BGM 控制與管理員按鈕 -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 音樂播放按鈕 -->
        <button id="bgmToggleBtn" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm font-medium border border-slate-700 transition">
          <i id="bgmIcon" class="fa-solid fa-compact-disc text-rose-400 text-base"></i>
          <span id="bgmStatusText" class="hidden sm:inline">BGM: 暫停</span>
        </button>

        <!-- 管理員切換 -->
        <button id="adminLoginBtn" class="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white text-xs sm:text-sm font-medium shadow-md shadow-rose-900/40 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-lock text-xs"></i>
          <span>管理員登入</span>
        </button>

        <button id="adminLogoutBtn" class="hidden px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs sm:text-sm font-medium transition flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
          <span>登出</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 隱藏的音訊元件 -->
  <audio id="bgmPlayer" loop preload="auto"></audio>

  <!-- 主內容容器 -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

    <!-- 相簿資訊橫幅 (Hero) -->
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-slate-800/90 to-slate-800/40 border border-slate-700/60 p-6 sm:p-10 mb-8 backdrop-blur shadow-2xl">
      <div class="max-w-2xl">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20 mb-3">
          <i class="fa-solid fa-sparkles mr-1.5 text-xs"></i> Cloud Firestore 即時串流
        </span>
        <h2 id="heroAlbumTitle" class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">
          相簿載入中...
        </h2>
        <p id="heroAlbumDesc" class="text-sm sm:text-base text-slate-300 leading-relaxed mb-4">
          記錄每一刻的珍貴時光。歡迎觀賞、留言與分享溫暖互動。
        </p>
        <div class="flex flex-wrap items-center gap-4 text-xs sm:text-sm text-slate-400">
          <span class="flex items-center"><i class="fa-solid fa-images mr-1.5 text-rose-400"></i><span id="photoCountDisplay">0</span> 張回憶</span>
          <span class="flex items-center"><i class="fa-solid fa-heart mr-1.5 text-pink-400"></i><span id="totalLikesDisplay">0</span> 個喜歡</span>
          <span class="flex items-center"><i class="fa-solid fa-comments mr-1.5 text-sky-400"></i><span id="totalCommentsDisplay">0</span> 則留言</span>
        </div>
      </div>
    </div>

    <!-- 管理者快捷工具列 (登入後顯示) -->
    <div id="adminPanel" class="hidden mb-8 p-6 bg-slate-800/80 border border-rose-500/30 rounded-2xl backdrop-blur shadow-xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-700/70 pb-3">
        <div class="flex items-center space-x-2 text-rose-400 font-semibold">
          <i class="fa-solid fa-sliders text-base"></i>
          <span>相簿管理工作台 (已驗證)</span>
        </div>
        <span class="text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full">管理權限生效中</span>
      </div>

      <!-- 管理：相簿名稱與 BGM 設定 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">相簿自訂名稱</label>
          <div class="flex gap-2">
            <input type="text" id="adminTitleInput" placeholder="例如：夏日海風隨行筆記" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
            <button id="saveTitleBtn" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-medium transition whitespace-nowrap">更新名稱</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">自訂背景音樂 (BGM 音訊網址 MP3)</label>
          <div class="flex gap-2">
            <input type="url" id="adminBgmInput" placeholder="https://example.com/music.mp3" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
            <button id="saveBgmBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-sm font-medium transition whitespace-nowrap">更新 BGM</button>
          </div>
        </div>
      </div>

      <!-- 管理：上傳/新增相片 -->
      <div class="border-t border-slate-700/70 pt-4">
        <h3 class="text-sm font-semibold text-slate-200 mb-3 flex items-center">
          <i class="fa-solid fa-plus-circle mr-1.5 text-emerald-400"></i> 新增相片項目
        </h3>
        <form id="addPhotoForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">相片網址 (URL)</label>
            <input type="url" id="newPhotoUrl" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">標題 / 描述</label>
            <input type="text" id="newPhotoTitle" required placeholder="陽光灑落的午後" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div class="flex items-end">
            <button type="submit" id="addPhotoSubmitBtn" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-sm transition shadow-lg shadow-emerald-900/40 flex items-center justify-center space-x-1.5">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>發佈照片</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 照片網格區域 -->
    <div id="photosLoading" class="py-20 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-700 border-t-rose-500 mb-4"></div>
      <p class="text-slate-400 text-sm">正在同步雲端相簿資料...</p>
    </div>

    <div id="photosGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 hidden">
      <!-- 相片卡片由 JavaScript 動態渲染 -->
    </div>

    <!-- 無照片時提示 -->
    <div id="noPhotosEmptyState" class="hidden text-center py-20 px-4">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-slate-800 flex items-center justify-center mb-4 text-slate-500 text-3xl">
        <i class="fa-regular fa-image"></i>
      </div>
      <h3 class="text-lg font-semibold text-slate-300">相簿內目前還沒有相片</h3>
      <p class="text-slate-500 text-sm mt-1 max-w-sm mx-auto">請以管理員身份登入並點選上方的「發佈照片」按鈕新增您的第一張回憶。</p>
    </div>
  </main>

  <!-- 照片詳情與留言抽屜 / 彈窗 -->
  <div id="photoModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-2 sm:p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl max-w-5xl w-full max-h-[92vh] overflow-hidden flex flex-col md:flex-row shadow-2xl relative">
      <!-- 關閉按鈕 -->
      <button id="closeModalBtn" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center backdrop-blur transition border border-slate-700">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- 左側：大圖展示 -->
      <div class="md:w-3/5 bg-black flex items-center justify-center relative overflow-hidden select-none min-h-[260px] md:min-h-[500px]">
        <img id="modalImage" src="" alt="" class="max-h-[85vh] w-full object-contain">
      </div>

      <!-- 右側：照片資訊與留言串 -->
      <div class="md:w-2/5 flex flex-col h-[50vh] md:h-auto border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900/95">
        <!-- 頂部資訊 -->
        <div class="p-4 sm:p-5 border-b border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <h3 id="modalPhotoTitle" class="text-base sm:text-lg font-bold text-white truncate pr-6">照片標題</h3>
            <button id="modalLikeBtn" class="flex items-center space-x-1 text-sm px-3 py-1 rounded-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition">
              <i class="fa-solid fa-heart"></i>
              <span id="modalLikesCount">0</span>
            </button>
          </div>
          <div class="text-xs text-slate-400 flex items-center space-x-3">
            <span id="modalCreatedAt"><i class="fa-regular fa-clock mr-1"></i>剛剛</span>
            <span id="modalCommentsCount"><i class="fa-regular fa-comment mr-1"></i>0 則留言</span>
          </div>
        </div>

        <!-- 留言列表區 -->
        <div id="modalCommentsList" class="flex-1 p-4 sm:p-5 overflow-y-auto space-y-3 custom-scroll">
          <div class="text-center py-8 text-slate-500 text-xs">載入留言中...</div>
        </div>

        <!-- 底部留言輸入框 -->
        <div class="p-4 border-t border-slate-800 bg-slate-900">
          <form id="commentForm" class="space-y-2">
            <div class="flex gap-2">
              <input type="text" id="commentAuthor" required placeholder="您的暱稱" class="w-1/3 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500">
              <input type="text" id="commentText" required placeholder="寫下溫暖的留言..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500">
            </div>
            <button type="submit" id="submitCommentBtn" class="w-full py-2 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5 shadow-md">
              <i class="fa-regular fa-paper-plane"></i>
              <span>送出留言</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- 管理員密碼驗證對話框 Modal -->
  <div id="adminAuthModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
      <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mb-4 mx-auto text-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h3 class="text-center text-lg font-bold text-white mb-1">管理員登入驗證</h3>
      <p class="text-center text-xs text-slate-400 mb-5">請輸入專屬管理密碼以存取相簿設定與相片管理</p>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">管理密碼</label>
          <input type="password" id="adminPasswordInput" required autocomplete="current-password" placeholder="請輸入管理密碼" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500 text-center tracking-widest">
          <p id="authErrorMsg" class="hidden text-xs text-rose-400 mt-1.5 text-center">密碼錯誤，請重新確認！</p>
        </div>
        <div class="flex space-x-2 pt-2">
          <button type="button" id="cancelAuthBtn" class="w-1/2 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition">取消</button>
          <button type="submit" class="w-1/2 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-rose-900/40">確認登入</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 通知訊息 Toast -->
  <div id="toastMessage" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none px-4 py-3 rounded-2xl bg-slate-800 border border-slate-700 shadow-2xl text-sm text-white flex items-center space-x-2.5">
    <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400"></i>
    <span id="toastText">操作成功</span>
  </div>

  <!-- Firebase 腳本 (模組載入) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      collection, 
      addDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 1. 初始化 Firebase 環境配置
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'personalized-album-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-api-key",
      authDomain: "demo-project.firebaseapp.com",
      projectId: "demo-project"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 管理員指定密碼
    const ADMIN_PASSCODE = "875106886104";
    let isAdminLoggedIn = false;

    // 當前開啟 Modal 的相片 ID
    let currentActivePhotoId = null;
    let commentsUnsubscribe = null;
    let localPhotosMap = new Map();
    let currentBgmUrl = "";

    // DOM 元素快取
    const navAlbumTitle = document.getElementById('navAlbumTitle');
    const heroAlbumTitle = document.getElementById('heroAlbumTitle');
    const adminPanel = document.getElementById('adminPanel');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const adminLogoutBtn = document.getElementById('adminLogoutBtn');
    const adminAuthModal = document.getElementById('adminAuthModal');
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const authErrorMsg = document.getElementById('authErrorMsg');
    const cancelAuthBtn = document.getElementById('cancelAuthBtn');

    const adminTitleInput = document.getElementById('adminTitleInput');
    const saveTitleBtn = document.getElementById('saveTitleBtn');
    const adminBgmInput = document.getElementById('adminBgmInput');
    const saveBgmBtn = document.getElementById('saveBgmBtn');
    const addPhotoForm = document.getElementById('addPhotoForm');
    const newPhotoUrl = document.getElementById('newPhotoUrl');
    const newPhotoTitle = document.getElementById('newPhotoTitle');

    const bgmPlayer = document.getElementById('bgmPlayer');
    const bgmToggleBtn = document.getElementById('bgmToggleBtn');
    const bgmIcon = document.getElementById('bgmIcon');
    const bgmStatusText = document.getElementById('bgmStatusText');

    const photosGrid = document.getElementById('photosGrid');
    const photosLoading = document.getElementById('photosLoading');
    const noPhotosEmptyState = document.getElementById('noPhotosEmptyState');
    const photoCountDisplay = document.getElementById('photoCountDisplay');
    const totalLikesDisplay = document.getElementById('totalLikesDisplay');
    const totalCommentsDisplay = document.getElementById('totalCommentsDisplay');

    // 彈窗元件
    const photoModal = document.getElementById('photoModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalImage = document.getElementById('modalImage');
    const modalPhotoTitle = document.getElementById('modalPhotoTitle');
    const modalLikesCount = document.getElementById('modalLikesCount');
    const modalLikeBtn = document.getElementById('modalLikeBtn');
    const modalCreatedAt = document.getElementById('modalCreatedAt');
    const modalCommentsCount = document.getElementById('modalCommentsCount');
    const modalCommentsList = document.getElementById('modalCommentsList');
    const commentForm = document.getElementById('commentForm');
    const commentAuthor = document.getElementById('commentAuthor');
    const commentText = document.getElementById('commentText');

    // Toast 通知函式
    function showToast(message, isError = false) {
      const toast = document.getElementById('toastMessage');
      const toastText = document.getElementById('toastText');
      const toastIcon = document.getElementById('toastIcon');

      toastText.textContent = message;
      if (isError) {
        toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // 2. 身份驗證流程 (遵循 RULE 3)
    let currentUser = null;
    async function authenticate() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
      } catch (err) {
        console.error("Auth error:", err);
      }
    }

    // 3. Firestore 監聽與資料綁定 (遵循 RULE 1 及 RULE 2)
    // 相簿設定 Doc 路徑: /artifacts/{appId}/public/data/albumSettings/config
    // 相片集合 Collection: /artifacts/{appId}/public/data/photos
    // 留言集合 Collection: /artifacts/{appId}/public/data/comments
    async function initAlbumSync() {
      if (!currentUser) return;

      const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'albumSettings', 'config');
      const photosColRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
      const commentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'comments');

      // 監聽相簿整體設定 (標題、BGM)
      onSnapshot(settingsDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          const title = data.title || "個人專屬記憶相簿";
          navAlbumTitle.textContent = title;
          heroAlbumTitle.textContent = title;
          adminTitleInput.value = title;

          if (data.bgmUrl && data.bgmUrl !== currentBgmUrl) {
            currentBgmUrl = data.bgmUrl;
            adminBgmInput.value = currentBgmUrl;
            bgmPlayer.src = currentBgmUrl;
          }
        } else {
          // 初始化預設值
          const defaultTitle = "回憶時光機";
          const defaultBgm = "https://actions.google.com/sounds/v1/ambient/relaxing_music.ogg";
          setDoc(settingsDocRef, {
            title: defaultTitle,
            bgmUrl: defaultBgm,
            updatedAt: Date.now()
          }).catch(console.error);
        }
      }, (err) => {
        console.error("Settings snapshot error:", err);
      });

      // 監聽全體留言以計算總數 (在記憶體中分組)
      let allComments = [];
      onSnapshot(commentsColRef, (snap) => {
        allComments = [];
        snap.forEach(docSnap => {
          allComments.push({ id: docSnap.id, ...docSnap.data() });
        });
        totalCommentsDisplay.textContent = allComments.length;

        // 若當前有開啟彈窗，刷新彈窗留言
        if (currentActivePhotoId) {
          renderCommentsForPhoto(currentActivePhotoId, allComments);
        }
      }, (err) => {
        console.error("Comments global snapshot error:", err);
      });

      // 監聽相片清單
      onSnapshot(photosColRef, (snap) => {
        photosLoading.classList.add('hidden');
        localPhotosMap.clear();

        const photosList = [];
        snap.forEach(docSnap => {
          const p = { id: docSnap.id, ...docSnap.data() };
          localPhotosMap.set(docSnap.id, p);
          photosList.push(p);
        });

        // 記憶體排序：最新建立的在最前
        photosList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        photoCountDisplay.textContent = photosList.length;
        const totalLikes = photosList.reduce((acc, curr) => acc + (curr.likes || 0), 0);
        totalLikesDisplay.textContent = totalLikes;

        if (photosList.length === 0) {
          noPhotosEmptyState.classList.remove('hidden');
          photosGrid.classList.add('hidden');
        } else {
          noPhotosEmptyState.classList.add('hidden');
          photosGrid.classList.remove('hidden');
          renderPhotoGrid(photosList, allComments);
        }

        // 若當前彈窗正開啟此相片，即時同步彈窗狀態
        if (currentActivePhotoId && localPhotosMap.has(currentActivePhotoId)) {
          const currentP = localPhotosMap.get(currentActivePhotoId);
          modalLikesCount.textContent = currentP.likes || 0;
          modalPhotoTitle.textContent = currentP.title;
        }
      }, (err) => {
        console.error("Photos snapshot error:", err);
        photosLoading.innerHTML = `<p class="text-rose-400 text-sm">相片資料載入失敗，請稍後重試。</p>`;
      });
    }

    // 渲染相片網格
    function renderPhotoGrid(photos, comments) {
      photosGrid.innerHTML = '';
      photos.forEach(photo => {
        const photoComments = comments.filter(c => c.photoId === photo.id);
        const card = document.createElement('div');
        card.className = "group bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-700/60 hover:border-slate-500 shadow-xl transition-all duration-300 flex flex-col hover:-translate-y-1";

        card.innerHTML = `
          <div class="relative aspect-video sm:aspect-square bg-slate-950 overflow-hidden cursor-pointer">
            <img src="${photo.imageUrl}" alt="${photo.title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Image+Unavailable'">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-4">
              <span class="text-white text-xs font-medium flex items-center"><i class="fa-solid fa-expand mr-1.5"></i>點擊放大查看</span>
            </div>
            ${isAdminLoggedIn ? `
              <button data-delete-id="${photo.id}" class="delete-photo-btn absolute top-3 right-3 w-8 h-8 rounded-full bg-red-600/80 hover:bg-red-600 text-white flex items-center justify-center backdrop-blur transition shadow-md">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            ` : ''}
          </div>
          <div class="p-4 flex flex-col flex-1 justify-between">
            <div>
              <h4 class="font-bold text-white text-base truncate mb-1" title="${photo.title}">${photo.title}</h4>
              <p class="text-slate-400 text-xs">${formatTimestamp(photo.createdAt)}</p>
            </div>
            <div class="flex items-center justify-between pt-4 mt-2 border-t border-slate-700/50">
              <button data-like-id="${photo.id}" class="like-card-btn flex items-center space-x-1.5 text-xs text-rose-400 hover:text-rose-300 font-medium py-1 px-2.5 rounded-lg hover:bg-rose-500/10 transition">
                <i class="fa-solid fa-heart"></i>
                <span>${photo.likes || 0}</span>
              </button>
              <button data-view-id="${photo.id}" class="view-comments-btn flex items-center space-x-1.5 text-xs text-slate-300 hover:text-white font-medium py-1 px-2.5 rounded-lg hover:bg-slate-700 transition">
                <i class="fa-regular fa-comment text-sky-400"></i>
                <span>${photoComments.length} 則留言</span>
              </button>
            </div>
          </div>
        `;

        // 點選圖片打開彈窗
        const imgContainer = card.querySelector('.relative.aspect-video');
        imgContainer.addEventListener('click', (e) => {
          if (e.target.closest('.delete-photo-btn')) return;
          openPhotoModal(photo.id);
        });

        // 點選「留言」打開彈窗
        card.querySelector('.view-comments-btn').addEventListener('click', () => {
          openPhotoModal(photo.id);
        });

        // 點選「按讚」
        card.querySelector('.like-card-btn').addEventListener('click', () => {
          handleLikePhoto(photo.id);
        });

        // 管理員刪除照片
        if (isAdminLoggedIn) {
          const deleteBtn = card.querySelector('.delete-photo-btn');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              handleDeletePhoto(photo.id);
            });
          }
        }

        photosGrid.appendChild(card);
      });
    }

    // 格式化時間
    function formatTimestamp(ts) {
      if (!ts) return '日前';
      const date = new Date(ts);
      return `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2, '0')}/${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    }

    // 按讚處理 (使用 Firestore updateDoc)
    async function handleLikePhoto(photoId) {
      if (!currentUser) return;
      try {
        const photo = localPhotosMap.get(photoId);
        if (!photo) return;
        const currentLikes = photo.likes || 0;
        const photoDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'photos', photoId);
        await updateDoc(photoDocRef, {
          likes: currentLikes + 1
        });
        showToast("已送出讚！");
      } catch (err) {
        console.error("Like error:", err);
        showToast("按讚失敗，請稍候重試", true);
      }
    }

    // 刪除相片處理 (管理者限定)
    async function handleDeletePhoto(photoId) {
      if (!isAdminLoggedIn) {
        showToast("需要管理員權限", true);
        return;
      }
      try {
        const photoDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'photos', photoId);
        await deleteDoc(photoDocRef);
        showToast("相片已成功刪除");
        if (currentActivePhotoId === photoId) {
          closePhotoModal();
        }
      } catch (err) {
        console.error("Delete photo error:", err);
        showToast("刪除失敗", true);
      }
    }

    // 開啟相片互動彈窗
    function openPhotoModal(photoId) {
      currentActivePhotoId = photoId;
      const photo = localPhotosMap.get(photoId);
      if (!photo) return;

      modalImage.src = photo.imageUrl;
      modalImage.onerror = () => { modalImage.src = 'https://placehold.co/800x600/1e293b/94a3b8?text=Image+Unavailable'; };
      modalPhotoTitle.textContent = photo.title;
      modalLikesCount.textContent = photo.likes || 0;
      modalCreatedAt.innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${formatTimestamp(photo.createdAt)}`;

      // 監聽並顯示該照片之留言
      photoModal.classList.remove('hidden');
      setTimeout(() => {
        photoModal.classList.remove('opacity-0');
      }, 10);

      // 觸發載入最新留言
      renderCommentsForPhoto(photoId);
    }

    // 關閉相片彈窗
    function closePhotoModal() {
      photoModal.classList.add('opacity-0');
      setTimeout(() => {
        photoModal.classList.add('hidden');
        currentActivePhotoId = null;
      }, 300);
    }

    // 渲染留言清單
    async function renderCommentsForPhoto(photoId, preloadedComments = null) {
      let comments = preloadedComments;
      if (!comments) {
        // 從 Firestore 取得最新留言
        try {
          const snap = await doc(db, 'artifacts', appId, 'public', 'data', 'comments');
        } catch (e) {}
      }

      // 篩選與排序
      const relevant = (preloadedComments || []).filter(c => c.photoId === photoId);
      relevant.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      modalCommentsCount.innerHTML = `<i class="fa-regular fa-comment mr-1"></i>${relevant.length} 則留言`;

      if (relevant.length === 0) {
        modalCommentsList.innerHTML = `
          <div class="text-center py-10 text-slate-500 text-xs">
            <i class="fa-regular fa-comments text-2xl mb-2 block opacity-40"></i>
            目前還沒有留言，快來搶頭香吧！
          </div>
        `;
        return;
      }

      modalCommentsList.innerHTML = '';
      relevant.forEach(item => {
        const commentItem = document.createElement('div');
        commentItem.className = 'bg-slate-800/60 rounded-xl p-3 border border-slate-800 text-xs flex flex-col space-y-1';
        commentItem.innerHTML = `
          <div class="flex items-center justify-between text-slate-400">
            <span class="font-semibold text-slate-200">${escapeHtml(item.author || '匿名朋友')}</span>
            <span class="text-[10px]">${formatTimestamp(item.createdAt)}</span>
          </div>
          <p class="text-slate-300 leading-relaxed break-words">${escapeHtml(item.text || '')}</p>
        `;
        modalCommentsList.appendChild(commentItem);
      });
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[s];
      });
    }

    // 彈窗按讚按鈕
    modalLikeBtn.addEventListener('click', () => {
      if (currentActivePhotoId) {
        handleLikePhoto(currentActivePhotoId);
      }
    });

    closeModalBtn.addEventListener('click', closePhotoModal);
    photoModal.addEventListener('click', (e) => {
      if (e.target === photoModal) closePhotoModal();
    });

    // 4. 新增留言事件
    commentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser || !currentActivePhotoId) return;

      const author = commentAuthor.value.trim();
      const text = commentText.value.trim();
      if (!author || !text) return;

      const submitBtn = document.getElementById('submitCommentBtn');
      submitBtn.disabled = true;

      try {
        const commentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'comments');
        await addDoc(commentsColRef, {
          photoId: currentActivePhotoId,
          author: author,
          text: text,
          createdAt: Date.now()
        });

        commentText.value = '';
        showToast("留言已成功送出！");
      } catch (err) {
        console.error("Add comment error:", err);
        showToast("留言發佈失敗", true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 5. 管理員身份驗證互動 (密碼 875106886104)
    adminLoginBtn.addEventListener('click', () => {
      adminAuthModal.classList.remove('hidden');
      adminPasswordInput.value = '';
      authErrorMsg.classList.add('hidden');
      adminPasswordInput.focus();
    });

    cancelAuthBtn.addEventListener('click', () => {
      adminAuthModal.classList.add('hidden');
    });

    adminLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredPass = adminPasswordInput.value.trim();

      if (enteredPass === ADMIN_PASSCODE) {
        isAdminLoggedIn = true;
        adminAuthModal.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        adminLoginBtn.classList.add('hidden');
        adminLogoutBtn.classList.remove('hidden');
        showToast("管理者登入成功！");
        // 重新渲染相片網格以顯示管理者刪除功能
        const photosList = Array.from(localPhotosMap.values()).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        renderPhotoGrid(photosList, []);
      } else {
        authErrorMsg.classList.remove('hidden');
        adminPasswordInput.value = '';
        adminPasswordInput.focus();
      }
    });

    adminLogoutBtn.addEventListener('click', () => {
      isAdminLoggedIn = false;
      adminPanel.classList.add('hidden');
      adminLoginBtn.classList.remove('hidden');
      adminLogoutBtn.classList.add('hidden');
      showToast("已成功登出管理員身分");
      const photosList = Array.from(localPhotosMap.values()).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      renderPhotoGrid(photosList, []);
    });

    // 6. 管理者修改相簿名稱
    saveTitleBtn.addEventListener('click', async () => {
      if (!isAdminLoggedIn) return;
      const newTitle = adminTitleInput.value.trim();
      if (!newTitle) {
        showToast("相簿名稱不可為空", true);
        return;
      }

      try {
        const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'albumSettings', 'config');
        await updateDoc(settingsDocRef, {
          title: newTitle,
          updatedAt: Date.now()
        });
        showToast("相簿名稱已即時更新");
      } catch (err) {
        console.error("Save title error:", err);
        showToast("更新名稱失敗", true);
      }
    });

    // 7. 管理者修改背景音樂 (BGM)
    saveBgmBtn.addEventListener('click', async () => {
      if (!isAdminLoggedIn) return;
      const newBgm = adminBgmInput.value.trim();
      if (!newBgm) {
        showToast("請輸入有效的音訊連結", true);
        return;
      }

      try {
        const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'albumSettings', 'config');
        await updateDoc(settingsDocRef, {
          bgmUrl: newBgm,
          updatedAt: Date.now()
        });
        showToast("BGM 背景音樂已更新");
      } catch (err) {
        console.error("Save BGM error:", err);
        showToast("更新音樂失敗", true);
      }
    });

    // 8. 管理者新增發佈照片
    addPhotoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isAdminLoggedIn) return;

      const url = newPhotoUrl.value.trim();
      const title = newPhotoTitle.value.trim();
      if (!url || !title) return;

      const submitBtn = document.getElementById('addPhotoSubmitBtn');
      submitBtn.disabled = true;

      try {
        const photosColRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
        await addDoc(photosColRef, {
          imageUrl: url,
          title: title,
          likes: 0,
          createdAt: Date.now()
        });

        newPhotoUrl.value = '';
        newPhotoTitle.value = '';
        showToast("照片已成功發佈！");
      } catch (err) {
        console.error("Add photo error:", err);
        showToast("發佈失敗，請稍後重試", true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 9. 背景音樂播放控制
    let isBgmPlaying = false;
    bgmToggleBtn.addEventListener('click', () => {
      if (!currentBgmUrl) {
        showToast("尚未設定背景音樂", true);
        return;
      }

      if (isBgmPlaying) {
        bgmPlayer.pause();
        isBgmPlaying = false;
        bgmIcon.classList.remove('disc-spin', 'text-emerald-400');
        bgmIcon.classList.add('text-rose-400');
        bgmStatusText.textContent = "BGM: 暫停";
      } else {
        bgmPlayer.play().then(() => {
          isBgmPlaying = true;
          bgmIcon.classList.add('disc-spin', 'text-emerald-400');
          bgmIcon.classList.remove('text-rose-400');
          bgmStatusText.textContent = "BGM: 播放中";
        }).catch(err => {
          console.warn("Autoplay / audio playback restriction:", err);
          showToast("瀏覽器已限制自動播放，請再次點擊播放", true);
        });
      }
    });

    // 初始化程式啟動
    window.addEventListener('DOMContentLoaded', async () => {
      await authenticate();
      initAlbumSync();
    });
  </script>
</body>
</html>
